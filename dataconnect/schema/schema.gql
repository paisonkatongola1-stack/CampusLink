# CampusLink Zambia Backend Schema

type User @table {
  id: String! @default(expr: "auth.uid")
  email: String!
  displayName: String
  role: String! # student, business, landlord, employer, admin
  university: String
  course: String
  year: String
  bio: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type Accommodation @table {
  id: UUID! @default(expr: "uuidV4()")
  title: String!
  price: String!
  distance: String!
  location: String!
  image: String!
  amenities: [String!]!
  university: String!
  landlord: User!
  createdAt: Timestamp! @default(expr: "request.time")
}

type MarketplaceItem @table {
  id: UUID! @default(expr: "uuidV4()")
  title: String!
  price: String!
  location: String!
  category: String!
  image: String!
  rating: Float @default(value: 0.0)
  seller: User!
  createdAt: Timestamp! @default(expr: "request.time")
}

type JobListing @table {
  id: UUID! @default(expr: "uuidV4()")
  role: String!
  company: String!
  location: String!
  salary: String!
  type: String! # Internship, Part-time, Full-time, Freelance
  tags: [String!]!
  employer: User!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Event @table {
  id: UUID! @default(expr: "uuidV4()")
  title: String!
  date: String!
  time: String!
  venue: String!
  organizerName: String!
  image: String!
  organizer: User!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Application @table {
  id: UUID! @default(expr: "uuidV4()")
  job: JobListing!
  applicant: User!
  status: String! @default(value: "pending") # pending, reviewed, shortlisted, rejected
  appliedAt: Timestamp! @default(expr: "request.time")
}

type Message @table {
  id: UUID! @default(expr: "uuidV4()")
  sender: User!
  receiver: User!
  text: String!
  sentAt: Timestamp! @default(expr: "request.time")
}
